<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>actsim profiler</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>actsim profiler</h1>
  <div class="inputs">
    <label>Design .act file
      <input id="designPath" class="path-input" type="text" placeholder="/path/to/design.act" size="48" title="Exactly the file you'd pass to `actsim <file> <top>` for the real simulation.">
    </label>
    <label>Top process
      <input id="topProc" type="text" placeholder="TopProcess" size="16" title="Exactly the process name you'd pass to `actsim <file> <top>` for the real simulation.">
    </label>
    <label>Focus instance path (optional)
      <input id="watchPrefix" type="text" placeholder="e.g. TB.space" size="16" title="Dotted instance path from the top process above down to whichever sub-instance's own hierarchy you want to view (matches what you'd type after `watch` at the actsim prompt). Leave blank to view the top process itself.">
    </label>
    <button id="loadBtn">Load hierarchy</button>
    <button id="themeToggle" class="icon-btn" title="Toggle light/dark theme">&#9728;&#65039;</button>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="floorplan">1. Floorplan</button>
    <button class="tab-btn" data-tab="replay">2. Replay</button>
  </nav>
</header>

<main>
  <section id="floorplan-view" class="view active">
    <div class="toolbar">
      <button id="autoLayoutBtn">Auto-arrange</button>
      <button id="expandBtn" title="Expand every selected module to show its own sub-instances nested inside it">Expand selected</button>
      <button id="collapseBtn" title="Collapse every selected module back to a plain box">Collapse selected</button>
      <button id="saveFloorplanBtn">Save floorplan</button>
      <span id="floorplanStatus" class="status"></span>
    </div>
    <div id="floorplanCanvas" class="canvas"></div>
  </section>

  <section id="replay-view" class="view">
    <div class="toolbar">
      <button id="runSimBtn">Run simulation (actsim)</button>
      <label>or load an existing trace.vcd
        <input id="vcdOverride" class="path-input" type="text" placeholder="/path/to/trace.vcd (e.g. from your own build)" size="52">
      </label>
      <button id="loadTraceBtn">Load trace</button>
      <span id="replayStatus" class="status"></span>
    </div>
    <div class="playback">
      <button id="playPauseBtn">Play</button>
      <input id="scrubber" type="range" min="0" max="0" value="0" step="1">
      <span id="timeLabel">t = 0</span>
      <label>Speed
        <select id="speedSelect">
          <option value="0.25">0.25x</option>
          <option value="1" selected>1x</option>
          <option value="4">4x</option>
          <option value="16">16x</option>
          <option value="64">64x</option>
          <option value="256">256x</option>
          <option value="1024">1024x</option>
          <option value="4096">4096x</option>
          <option value="16384">16384x</option>
          <option value="65536">65536x</option>
          <option value="262144">262144x</option>
        </select>
      </label>
      <label>Activity window
        <input id="activityWindow" type="number" min="0" max="100" step="0.1" size="6" title="A channel counts as 'active' (green) if it had a real transaction within this % of the total trace length, centered on the current instant -- not just at this exact instant. Real transactions are near-instantaneous relative to typical trace lengths, so without a window even a very busy module would almost never show green. Defaults to 0.5%; increase to make brief bursts more visible, decrease for a more literal instant-by-instant view.">%
      </label>
    </div>
    <div id="replayCanvas" class="canvas"></div>
    <div class="legend">
      <span><i class="swatch idle"></i> idle</span>
      <span><i class="swatch active"></i> active</span>
      <span><i class="swatch blocked"></i> blocked</span>
    </div>
  </section>
</main>

<script src="common.js"></script>
<script src="floorplan.js"></script>
<script src="replay.js"></script>
</body>
</html>
