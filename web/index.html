<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisualAct</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>VisualAct</h1>
  <div class="inputs">
    <label>Design .act file
      <input id="designPath" class="path-input" type="text" list="designPathList" placeholder="/path/to/design.act" size="48" title="Exactly the file you'd pass to `actsim <file> <top>` for the real simulation.">
      <datalist id="designPathList"></datalist>
    </label>
    <label>Top process
      <input id="topProc" type="text" list="topProcList" placeholder="TopProcess" size="16" title="Exactly the process name you'd pass to `actsim <file> <top>` for the real simulation.">
      <datalist id="topProcList"></datalist>
    </label>
    <label>Focus instance path (optional)
      <input id="watchPrefix" type="text" list="watchPrefixList" placeholder="e.g. TB.space" size="16" title="Dotted instance path from the top process above down to whichever sub-instance's own hierarchy you want to view (matches what you'd type after `watch` at the actsim prompt). Leave blank to view the top process itself.">
      <datalist id="watchPrefixList"></datalist>
    </label>
    <button id="loadBtn">&#128229; Load hierarchy</button>
    <button id="themeToggle" class="icon-btn" title="Toggle light/dark theme">&#9728;&#65039;</button>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="floorplan">1. Floorplan</button>
    <button class="tab-btn" data-tab="replay">2. Replay</button>
    <label class="search-box">
      <span class="search-icon" aria-hidden="true">&#128269;</span>
      <input id="searchBox" type="text" placeholder="find a module..." title="Highlights every module whose name contains this text, in whichever tab is currently open.">
    </label>
    <button id="addSearchMatchesBtn" title="Add every module currently highlighted by the search box to the Replay tab's selection, and open the channel status panel">&#10133; Add search matches</button>
  </nav>
</header>

<main>
  <section id="floorplan-view" class="view active">
    <div class="toolbar">
      <button id="autoLayoutBtn">&#128208; Auto-arrange</button>
      <button id="saveFloorplanBtn">&#128190; Save floorplan</button>
      <span id="floorplanStatus" class="status"></span>
    </div>
    <div id="floorplanCanvas" class="canvas">
      <div class="corner-egg">
        <div class="corner-fold"></div>
        <div class="corner-reveal">
          <svg viewBox="0 0 230 110" class="async-circuit">
            <text class="egg-title" x="115" y="18">AVLSI</text>
            <line class="wire" x1="20" y1="55" x2="220" y2="55"></line>
            <g class="gate"><rect x="20" y="40" width="30" height="30" rx="6" style="animation-delay:0s"></rect><text x="35" y="60">C</text></g>
            <g class="gate"><rect x="80" y="40" width="30" height="30" rx="6" style="animation-delay:0.6s"></rect><text x="95" y="60">C</text></g>
            <g class="gate"><rect x="140" y="40" width="30" height="30" rx="6" style="animation-delay:1.3s"></rect><text x="155" y="60">C</text></g>
            <g class="gate"><rect x="190" y="40" width="30" height="30" rx="6" style="animation-delay:1.9s"></rect><text x="205" y="60">C</text></g>
            <circle class="token" cx="35" cy="55" r="6"></circle>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <section id="replay-view" class="view">
    <div class="toolbar">
      <button id="runSimBtn">&#9654;&#65039; Run simulation (actsim)</button>
      <label>or load an existing trace.vcd
        <input id="vcdOverride" class="path-input" type="text" list="vcdOverrideList" placeholder="/path/to/trace.vcd (e.g. from your own build)" size="52">
        <datalist id="vcdOverrideList"></datalist>
      </label>
      <button id="loadTraceBtn">&#128194; Load trace</button>
      <button id="channelStatusBtn" title="Show the channel-by-channel status (pending / just completed) of the currently selected module(s)">&#128202; Channel status</button>
      <span id="replayStatus" class="status"></span>
    </div>
    <div class="playback">
      <button id="playPauseBtn">&#9654;&#65039; Play</button>
      <input id="scrubber" type="range" min="0" max="0" value="0" step="1">
      <span id="timeLabel">t = 0</span>
      <label>Speed
        <select id="speedSelect">
          <option value="0.25">0.25x</option>
          <option value="1" selected>1x</option>
          <option value="4">4x</option>
          <option value="16">16x</option>
          <option value="64">64x</option>
          <option value="256">256x</option>
          <option value="1024">1024x</option>
          <option value="4096">4096x</option>
          <option value="16384">16384x</option>
          <option value="65536">65536x</option>
          <option value="262144">262144x</option>
        </select>
      </label>
      <label class="window-label active-label" title="A channel counts as 'active' (green) if it had a real transaction within this % of the total trace length, centered on the current instant -- not just at this exact instant. Real transactions are near-instantaneous relative to typical trace lengths, so without a window even a very busy module would almost never show green. Defaults to 0.5%; increase to make brief bursts more visible, decrease for a more literal instant-by-instant view.">Activity window
        <input id="activityWindow" type="number" min="0" max="100" step="0.1" size="6">%
      </label>
      <label class="window-label pending-label" title="A channel counts as 'pending' (amber) only if it's currently blocked AND had a real transaction within (this number) x the Activity window. Too high and a one-time event from long ago (e.g. a startup flush touching every module) can make an otherwise-unused module look busy for a huge stretch of the trace afterward. Lower this if modules you know are unused still show amber; raise it if genuinely-used-but-bursty modules flicker white too often. Defaults to 5.">Pending window &times;
        <input id="blockedMultiplier" type="number" min="0" step="0.5" size="5">
      </label>
    </div>
    <div class="replay-body">
      <div id="replayCanvas" class="canvas">
        <div class="corner-egg">
          <div class="corner-fold"></div>
          <div class="corner-reveal">
            <svg viewBox="0 0 230 110" class="async-circuit">
              <text class="egg-title" x="115" y="18">AVLSI</text>
              <line class="wire" x1="20" y1="55" x2="220" y2="55"></line>
              <g class="gate"><rect x="20" y="40" width="30" height="30" rx="6" style="animation-delay:0s"></rect><text x="35" y="60">C</text></g>
              <g class="gate"><rect x="80" y="40" width="30" height="30" rx="6" style="animation-delay:0.6s"></rect><text x="95" y="60">C</text></g>
              <g class="gate"><rect x="140" y="40" width="30" height="30" rx="6" style="animation-delay:1.3s"></rect><text x="155" y="60">C</text></g>
              <g class="gate"><rect x="190" y="40" width="30" height="30" rx="6" style="animation-delay:1.9s"></rect><text x="205" y="60">C</text></g>
              <circle class="token" cx="35" cy="55" r="6"></circle>
            </svg>
          </div>
        </div>
      </div>
      <div id="channelPanel" class="channel-panel" hidden>
        <div class="channel-panel-header">
          <span id="channelPanelTitle">Channel status</span>
          <button id="closeChannelPanel" class="icon-btn" title="Close">&times;</button>
        </div>
        <div id="channelPanelBody" class="channel-panel-body"></div>
      </div>
    </div>
    <div class="legend">
      <span><i class="swatch idle"></i> idle</span>
      <span><i class="swatch active"></i> active</span>
      <span><i class="swatch blocked"></i> blocked</span>
      <span class="hint">Select module(s) in the canvas (click, or Cmd/Ctrl/Shift-click for more) then click "Channel status."</span>
    </div>
  </section>
</main>

<script src="common.js"></script>
<script src="floorplan.js"></script>
<script src="replay.js"></script>
</body>
</html>
